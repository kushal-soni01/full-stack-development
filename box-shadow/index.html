<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .card {
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            padding: 10px;
            height: 300px;
            width: 300px;
            margin: auto;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0px 5px 20px red;
        }

        h1 {
            text-shadow: 10px 10px 6px gray;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Hello World</h1>
    </div>
</body>

</html>
