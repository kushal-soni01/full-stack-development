<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        .card {
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            padding: 10px;
            height: 300px;
            width: 300px;
            margin: auto;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.5s ease;
            box-shadow: 0px 5px 20px red;
        }

        .subcard {
            height: 100%;
            width: 100%;
            border-radius: 20px;
            box-shadow: inset 5px 5px 5px black;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.5s ease;
        }

        .subcard:hover {
            box-shadow: inset -5px -5px 15px black;
        }

        .card:hover {
            box-shadow: 0px 5px 40px red;
        }

        h1 {
            text-shadow: 10px 10px 6px gray;
            transition: all 0.5s ease;
        }

        h1:active {
            transform: scale(1.3);
            text-shadow: 10px 10px 6px transparent;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="subcard">
            <h1>Hello World</h1>
        </div>
    </div>
</body>

</html>
