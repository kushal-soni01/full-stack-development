<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            outline: 1px solid black;
            height: 500px;
            width: 500px;
            display: grid;
            grid-template-rows: 1fr 1fr 1fr;
            grid-template-columns: 1fr 1fr 1fr;

            div {
                outline: 1px dashed black;
                font-size: 28px;
                font-weight: bolder;
            }
        }

        .box1 {
            /* grid-column-start: 1;
            grid-column-end: 3;
            grid-row-start: 1;
            grid-row-end: 3; */
            grid-column: 2/4;
            grid-row: 2/4;
        }

        .box6 {
            grid-column: 2/3;
            grid-row: 2/3;
        }

        .parent {
            outline: 1px solid black;
            height: 350px;
            width: 350px;
            display: grid;
            background-color: blue;
        }


        .child {
            outline: 1px solid black;
            height: 200px;
            width: 200px;
            background-color: red;
        }
    </style>
</head>

<body>
    <!-- <div class="container">
        <div class="box1">1</div>
        <div class="box2">2</div>
        <div class="box3">3</div>
        <div class="box4">4</div>
        <div class="box5">5</div>
        <div class="box6">6</div>
    </div> -->

    <div class="container">
        <div class="parent">
            <div class="child"></div>
        </div>
    </div>
</body>

</html>
