<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            background: #f4f4f9;
        }

        .container {
            width: 100%;
            min-height: 100vh;
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            grid-auto-rows: 120px;
            gap: 15px;
        }

        .imgbox {
            background: palevioletred;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="imgbox">1</div>
        <div class="imgbox">2</div>
        <div class="imgbox">3</div>
        <div class="imgbox">4</div>
        <div class="imgbox">5</div>
        <div class="imgbox">6</div>
        <div class="imgbox">7</div>
        <div class="imgbox">8</div>
        <div class="imgbox">9</div>
        <div class="imgbox">10</div>
        <div class="imgbox">11</div>
        <div class="imgbox">12</div>
    </div>
</body>

</html>
